services:
  mongodb:
    image: mongo:8.0.16
    container_name: yelp-tucson-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-yelp_tucson}
      RAW_DATA_DIR: ${RAW_DATA_DIR:-/data/raw}
      PROCESSED_DATA_DIR: ${PROCESSED_DATA_DIR:-/data/processed}
    volumes:
      - ./data/raw:/data/raw:ro
      - ./data/processed:/data/processed
      - ./results:/app/results

volumes:
  mongodb_data:

